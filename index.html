      resetBtn: $('[data-side="negative"][data-side-action="reset"]')
    }
  };

  const DEFAULT_LOGO_SRC = dom.brandLogo ? dom.brandLogo.getAttribute('src') : '';

  /* ------------------------------------------------------------------
     Toast / announcements
  ------------------------------------------------------------------ */
  function toast(message, type = '') {
    const item = document.createElement('div');
    item.className = 'toast' + (type === 'error' ? ' error' : '');
    item.textContent = message;
    dom.toastWrap.appendChild(item);
    window.setTimeout(() => {
      item.classList.add('is-out');
      window.setTimeout(() => item.remove(), 300);
    }, 2400);
  }

  function announce(message) {
    dom.liveRegion.textContent = '';
    window.setTimeout(() => { dom.liveRegion.textContent = message; }, 20);
  }

  function warnStorageOnce() {
    if (storageWarned) return;
    storageWarned = true;
    toast('本地存储空间不足，部分设置仅本次生效', 'error');
  }

  /* ------------------------------------------------------------------
     Persistence
  ------------------------------------------------------------------ */
  function saveState() {
    const payload = {
      imageBlur: state.imageBlur,
      imageDim: state.imageDim,
      font: state.font,
      sound: state.sound,
      viewpoints: state.viewpoints,
      eventTitle: state.eventTitle,
      eventKicker: state.eventKicker,
      phases: state.phases
    };
    if (!writeStorage(STORAGE_KEYS.settings, JSON.stringify(payload))) warnStorageOnce();
  }

  function queueSave() {
    window.clearTimeout(saveTimer);
    saveTimer = window.setTimeout(saveState, 240);
  }

  /* ------------------------------------------------------------------
     Theme
  ------------------------------------------------------------------ */
  function applyTheme() {
    dom.root.dataset.theme = 'ivory';
    dom.root.dataset.mode = THEMES.ivory.mode;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', THEMES.ivory.bg);
  }

  /* ------------------------------------------------------------------
     Background
  ------------------------------------------------------------------ */
  function applyBackground() {
    const effectiveBackground = state.image ? 'image' : 'spotlight';
    dom.root.dataset.bg = effectiveBackground;
    if (state.image) {
      if (dom.customBg.getAttribute('src') !== state.image) dom.customBg.src = state.image;
    } else {
      dom.customBg.removeAttribute('src');
    }
    const blur = clamp(Number(state.imageBlur) || 0, 0, 24);
    dom.customBg.style.filter = `blur(${blur}px) saturate(.94)`;
    dom.customBg.style.transform = `scale(${1.035 + blur * .006})`;
    dom.customBgDim.style.opacity = String(clamp(Number(state.imageDim) || 0, 0, 90) / 100);
    syncBgUI();
  }

  function syncBgUI() {
    const hasImage = !!state.image;
    dom.imageControls.hidden = !hasImage;
    dom.bgBlur.value = String(state.imageBlur);
    dom.bgDim.value = String(state.imageDim);
    dom.bgBlurOut.textContent = String(state.imageBlur);
    dom.bgDimOut.textContent = String(state.imageDim);
  }

  function loadImage(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('image-load-failed'));
      img.src = url;
    });
  }

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      if (!file.type || !/^image\/(jpeg|png|webp)$/.test(file.type)) {
        reject(new Error('unsupported'));
        return;
      }
      if (file.size > 24 * 1024 * 1024) {
        reject(new Error('too-large'));
        return;
      }
      const objectUrl = URL.createObjectURL(file);
      loadImage(objectUrl).then(img => {
        const maxSide = 1920;
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
        const w = Math.max(1, Math.round((img.naturalWidth || 1) * scale));
        const h = Math.max(1, Math.round((img.naturalHeight || 1) * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(objectUrl);
        let data = canvas.toDataURL('image/webp', .84);
        if (data.length > 3_600_000) data = canvas.toDataURL('image/webp', .68);
        resolve(data);
      }).catch(err => {
        URL.revokeObjectURL(objectUrl);
        reject(err);
      });
    });
  }

  async function handleBackgroundFile(file) {
    if (!file) return;
    const original = dom.uploadBgBtn.innerHTML;
    dom.uploadBgBtn.disabled = true;
    dom.uploadBgBtn.innerHTML = '<span>正在处理图片…</span><small>请稍候</small>';
    try {
      const data = await compressImage(file);
      state.image = data;
      state.imageKind = 'upload';
      if (!writeStorage(STORAGE_KEYS.background, data)) {
        removeStorage(STORAGE_KEYS.background);
        toast('背景图过大，仅本次生效', 'error');
      }
      applyBackground();
      saveState();
      toast('背景图已应用');
    } catch (err) {
      const message = err && err.message === 'too-large'
        ? '图片超过 24MB，请换一张较小的图片'
        : '无法读取这张图片，请使用 JPG / PNG / WEBP';
      toast(message, 'error');
    } finally {
      dom.uploadBgBtn.disabled = false;
      dom.uploadBgBtn.innerHTML = original;
      dom.bgFile.value = '';
    }
  }

  function clearBackground() {
    state.image = '';
    state.imageKind = '';
    removeStorage(STORAGE_KEYS.background);
    dom.customBg.removeAttribute('src');
    applyBackground();
    saveState();
    toast('已移除背景图');
  }

  /* ------------------------------------------------------------------
     Event logo
  ------------------------------------------------------------------ */
  async function handleLogoFile(file) {
    if (!file) return;
    if (file.type && !/^image\//.test(file.type)) {
      toast('请使用 PNG、WEBP 或 JPG 图片', 'error');
      return;
    }
    if (file.size > 8 * 1024 * 1024) {
      toast('LOGO 文件超过 8MB，请换一张较小的 PNG', 'error');
      return;
    }
    try {
      const dataUrl = await blobToDataURL(file);
      await loadImage(dataUrl);
      dom.brandLogo.src = dataUrl;
      syncLogoUI(true);
      if (!writeStorage(STORAGE_KEYS.logo, dataUrl)) {
        removeStorage(STORAGE_KEYS.logo);
        toast('LOGO 较大，仅本次生效', 'error');
      } else {
        toast('LOGO 已更新');
      }
    } catch (err) {
      toast('无法读取该 LOGO 图片', 'error');
    } finally {
      dom.logoFile.value = '';
    }
  }

  function syncLogoUI(hasCustom) {
    const custom = !!hasCustom;
    dom.brandLogo.hidden = !custom;
    dom.brandLogo.classList.toggle('is-custom', custom);
    if (dom.brandPlaceholder) dom.brandPlaceholder.hidden = custom;
  }

  function resetLogo() {
    removeStorage(STORAGE_KEYS.logo);
    syncLogoUI(false);
    toast('已恢复为待上传状态');
  }

  /* ------------------------------------------------------------------
     Side emblems (team crests)
  ------------------------------------------------------------------ */
  function syncEmblemPreviews() {
    const previews = {
      affirmative: dom.affEmblemPreview,
      negative: dom.negEmblemPreview
    };
    SIDES.forEach(side => {
      const preview = previews[side];
      if (!preview) return;
      const src = sideEmblems[side];
      preview.style.backgroundImage = src ? 'url("' + src + '")' : '';
      preview.classList.toggle('is-empty', !src);
    });
  }

  function applySideEmblems() {
    SIDES.forEach(side => {
      const identity = sideDom[side] && sideDom[side].identity;
      if (!identity) return;
      const src = sideEmblems[side];
      if (src) {
        identity.style.setProperty('--side-icon', 'url("' + src + '")');
        identity.classList.add('has-custom-emblem');
      } else {
        identity.style.removeProperty('--side-icon');
        identity.classList.remove('has-custom-emblem');
      }
    });
    syncEmblemPreviews();
  }

  async function handleEmblemFile(side, file) {
    if (!file) return;
    if (file.type && !/^image\//.test(file.type)) {
      toast('请使用 PNG、WEBP、JPG 或 SVG 图片', 'error');
      return;
    }
    if (file.size > 8 * 1024 * 1024) {
      toast('队徽文件超过 8MB，请换一张较小的图片', 'error');
      return;
    }
    try {
      const dataUrl = await blobToDataURL(file);
      const image = await loadImage(dataUrl);
      const max = 640;
      const width = image.naturalWidth || image.width;
      const height = image.naturalHeight || image.height;
      if (!width || !height) throw new Error('empty-image');
      const scale = Math.min(1, max / Math.max(width, height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(width * scale));
      canvas.height = Math.max(1, Math.round(height * scale));
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
      const output = canvas.toDataURL('image/webp', .9);
      sideEmblems[side] = output;
      applySideEmblems();
      if (!writeStorage(STORAGE_KEYS.emblems, JSON.stringify(sideEmblems))) {
        toast('队徽较大，仅本次生效', 'error');
      } else {
        toast(SIDE_NAMES[side] + '队徽已更新');
      }
    } catch (err) {
      toast('无法读取这张队徽图片，请换一张试试', 'error');
    } finally {
      const input = side === 'affirmative' ? dom.affEmblemFile : dom.negEmblemFile;
      if (input) input.value = '';
    }
  }

  function resetEmblem(side) {
    sideEmblems[side] = '';
    applySideEmblems();
    if (sideEmblems.affirmative || sideEmblems.negative) {
      writeStorage(STORAGE_KEYS.emblems, JSON.stringify(sideEmblems));
    } else {
      removeStorage(STORAGE_KEYS.emblems);
    }
    toast('已恢复' + SIDE_NAMES[side] + '默认队徽');
  }

  /* ------------------------------------------------------------------
     Typography
  ------------------------------------------------------------------ */
  function applyFont() {
    if (!FONTS[state.font]) state.font = 'mono';
    const family = FONTS[state.font].family;
    dom.root.style.setProperty('--font-ui', family);
    dom.root.style.setProperty('--font-display', family);
    dom.root.style.setProperty('--font-timer', family);
    dom.root.style.setProperty('--font-mono', family);
    syncFontUI();
    window.requestAnimationFrame(fitEventTitle);
  }

  function syncFontUI() {
    $$('.font-card', dom.fontGrid).forEach(card => {
      const active = card.dataset.fontValue === state.font;
      card.classList.toggle('is-active', active);
      card.setAttribute('aria-pressed', String(active));
    });
  }

  function selectFont(id) {
    if (!FONTS[id]) return;
    state.font = id;
    applyFont();
    queueSave();
  }

  function blobToDataURL(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result));
      reader.onerror = () => reject(reader.error || new Error('read-failed'));
      reader.readAsDataURL(blob);
    });
  }

  /* ------------------------------------------------------------------
     Sound
  ------------------------------------------------------------------ */
  function ensureAudio() {
    if (!state.sound) return null;
    try {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    } catch (err) {
      return null;
    }
  }

  function tone(freq, delay, duration, volume = .08, type = 'sine') {
    if (!audioCtx || !state.sound) return;
    const start = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(volume, start + .018);
    gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + duration + .05);
  }

  function playCue(kind, side = 'affirmative') {
    if (!state.sound) return;
    if (!ensureAudio()) return;
    const detune = side === 'negative' ? .87 : 1;
    if (kind === 'warn30') {
      tone(740 * detune, 0, .34, .07, 'sine');
      tone(988 * detune, .17, .42, .055, 'sine');
    } else if (kind === 'warn10') {
      tone(880 * detune, 0, .26, .08, 'triangle');
      tone(1174 * detune, .16, .48, .07, 'triangle');
    } else if (kind === 'end') {
      tone(523.25 * detune, 0, .9, .075, 'triangle');
      tone(659.25 * detune, .18, .95, .075, 'triangle');
      tone(783.99 * detune, .36, 1.2, .07, 'triangle');
    } else if (kind === 'blip') {
      tone(660, 0, .08, .035, 'square');
    }
  }

  function syncSoundUI() {
    dom.soundBtn.classList.toggle('is-off', !state.sound);
    dom.soundBtn.setAttribute('aria-pressed', String(state.sound));
    dom.soundBtn.setAttribute('aria-label', state.sound ? '关闭提示音' : '开启提示音');
    dom.soundToggle.classList.toggle('is-on', state.sound);
    dom.soundToggle.setAttribute('aria-checked', String(state.sound));
  }

  function toggleSound() {
    state.sound = !state.sound;
    syncSoundUI();
    if (state.sound) {
      ensureAudio();
      playCue('blip');
    }
    queueSave();
  }

  /* ------------------------------------------------------------------
     Timer engine
  ------------------------------------------------------------------ */
  function currentPhase() {
    return state.phases[timer.index] || state.phases[0];
  }

  function stopLoop() {
    if (timer.raf) {
      cancelAnimationFrame(timer.raf);
      timer.raf = 0;
    }
  }

  function startLoop() {
    if (!timer.raf) timer.raf = requestAnimationFrame(tick);
  }

  function sideStateText(side) {
    const t = sideTimers[side];
    if (t.ended) return '时间到';
    if (t.running) return '发言席';
    if (t.remaining < t.total - .05) return '已暂停';
    return '待机';
  }

  function renderSide(side, force = false) {
    const t = sideTimers[side];
    const d = sideDom[side];
    const display = formatClock(t.remaining);
    if (force || d.clock.textContent !== display) d.clock.textContent = display;

    const ratio = t.total > 0 ? clamp(t.remaining / t.total, 0, 1) : 0;
    d.progress.style.transform = `scaleX(${ratio})`;
    d.state.textContent = sideStateText(side);

    const warning = !t.ended && t.remaining <= 30 && t.remaining > 10;
    const danger = !t.ended && t.remaining <= 10;
    d.panel.classList.toggle('is-running', t.running);
    d.panel.classList.toggle('is-warning', warning);
    d.panel.classList.toggle('is-danger', danger);
    d.panel.classList.toggle('is-finished', t.ended);

    let actionLabel = '开始计时';
    if (t.running) actionLabel = '暂停计时';
    else if (t.ended) actionLabel = '重新开始';
    else if (t.remaining < t.total - .05) actionLabel = '继续计时';
    d.action.textContent = actionLabel;
    d.action.classList.toggle('is-running', t.running);
    d.action.setAttribute('aria-label', actionLabel + SIDE_NAMES[side]);
  }

  function applyViewpoints() {
    dom.affViewpoint.value = state.viewpoints.affirmative;
    dom.negViewpoint.value = state.viewpoints.negative;
  }

  function applyEventText() {
    const title = (state.eventTitle || '').trim();
    const kicker = (state.eventKicker || '').trim();
    const titleEmpty = !title;
    const kickerEmpty = !kicker;

    dom.eventTitle.textContent = titleEmpty ? '请输入赛事主标题' : title;
    dom.eventTitle.classList.toggle('is-placeholder', titleEmpty);
    dom.eventTitle.title = titleEmpty ? '点击设置赛事主标题' : title;
    dom.eventTitleInput.value = state.eventTitle;

    dom.eventKicker.textContent = kickerEmpty ? '请输入赛事副标题' : kicker;
    dom.eventKicker.classList.toggle('is-placeholder', kickerEmpty);
    dom.eventKicker.title = kickerEmpty ? '点击设置赛事副标题' : kicker;
    dom.eventKickerInput.value = state.eventKicker;

    dom.eventHeader.classList.toggle('is-long-copy', kicker.length > 24);
    window.requestAnimationFrame(fitEventTitle);
  }

  function fitEventTitle() {
    const el = dom.eventTitle;
    if (!el) return;
    el.style.fontSize = '';
    const max = el.clientWidth;
    if (!max) return;
    let size = parseFloat(getComputedStyle(el).fontSize);
    let guard = 0;
    while (el.scrollWidth > max && size > 16 && guard < 120) {
      size -= 1;
      el.style.fontSize = size + 'px';
      guard += 1;
    }
    centerHeading();
  }

  function centerHeading() {
    const brand = dom.eventBrand;
    const heading = dom.eventHeading;
    const phase = dom.phaseName;
    if (!brand || !heading || !phase) return;
    heading.style.transform = '';
    const b = brand.getBoundingClientRect();
    const p = phase.getBoundingClientRect();
    const h = heading.getBoundingClientRect();
    if (!h.height || !b.height || !p.height) return;
    const target = (b.bottom + p.top) / 2;
    const current = h.top + h.height / 2;
    const delta = target - current;
    if (Math.abs(delta) > 0.5) {
      heading.style.transform = 'translateY(' + delta.toFixed(2) + 'px)';
    }
  }

  function updateTitle() {
    const started = SIDES.some(side => {
      const t = sideTimers[side];
      return t.running || t.ended || t.remaining < t.total - .05;
    });
    const aff = formatClock(sideTimers.affirmative.remaining);
    const neg = formatClock(sideTimers.negative.remaining);
    const next = started
      ? `${aff} 正 · ${neg} 反 | ${currentPhase().name} | 辩论赛计时器`
      : '辩论赛计时器';
    if (document.title !== next) document.title = next;
  }

  function switchTarget() {
    const running = SIDES.find(side => sideTimers[side].running);
    if (running) return otherSide(running);
    const current = sideTimers[activeSide];
    if (current.ended || current.remaining < current.total - .05) return otherSide(activeSide);
    return activeSide;
  }

  function updateSwitchHint() {
    const target = switchTarget();
    const label = '切换至' + SIDE_NAMES[target];
    dom.switchSideBtn.title = label;
    dom.switchSideBtn.setAttribute('aria-label', label);
  }

  function syncActionLabels() {
    SIDES.forEach(side => {
      const t = sideTimers[side];
      const d = sideDom[side];
      let label = '开始计时';
      if (t.running) label = '暂停计时';
      else if (t.ended) label = '重新开始';
      else if (t.remaining < t.total - .05) label = '继续计时';
      d.action.textContent = label;
      d.action.classList.toggle('is-running', t.running);
      d.action.setAttribute('aria-label', label + SIDE_NAMES[side]);
    });
  }

  function updatePhaseControls() {
    dom.prevPhaseBtn.disabled = timer.index <= 0;
    dom.nextPhaseBtn.disabled = timer.index >= state.phases.length - 1;
    updateSwitchHint();
    syncActionLabels();
    updateTitle();
  }

  function resetSide(side) {
    const t = sideTimers[side];
    t.running = false;
    t.ended = false;
    t.total = currentPhase().seconds;
    t.remaining = t.total;
    t.warn30 = false;
    t.warn10 = false;
    t.endAt = 0;
    renderSide(side, true);
    if (!SIDES.some(key => sideTimers[key].running)) stopLoop();
    updatePhaseControls();
  }

  function resetBothTimers() {
    stopLoop();
    SIDES.forEach(side => {
      const t = sideTimers[side];
      t.running = false;
      t.ended = false;
      t.total = currentPhase().seconds;
      t.remaining = t.total;
      t.warn30 = false;
      t.warn10 = false;
      t.endAt = 0;
      renderSide(side, true);
    });
    dom.screenFlash.classList.remove('is-active');
    updatePhaseControls();
  }

  function pauseSide(side, options = {}) {
    const t = sideTimers[side];
    if (!t.running) return;
    t.remaining = Math.max(0, (t.endAt - performance.now()) / 1000);
    t.running = false;
    if (!SIDES.some(key => sideTimers[key].running)) stopLoop();
    renderSide(side, true);
    updatePhaseControls();
    if (options.announcePause !== false) announce(SIDE_NAMES[side] + '计时暂停');
  }

  function startSide(side, options = {}) {
    const t = sideTimers[side];
    if (t.running) return;

    const other = side === 'affirmative' ? 'negative' : 'affirmative';
    if (sideTimers[other].running) pauseSide(other, { announcePause: false });

    ensureAudio();
    if (t.ended || t.remaining <= .02) {
      t.ended = false;
      t.total = currentPhase().seconds;
      t.remaining = t.total;
      t.warn30 = false;
      t.warn10 = false;
      t.endAt = 0;
    }

    activeSide = side;
    t.running = true;
    t.endAt = performance.now() + t.remaining * 1000;
    renderSide(side, true);
    updatePhaseControls();
    startLoop();
    if (options.announceStart !== false) announce(SIDE_NAMES[side] + '计时开始');
  }

  let lastToggleAt = { affirmative: 0, negative: 0 };

  function toggleSide(side) {
    // Each side's primary button only controls that side.
    // Pause is always allowed; only a rapid restart after a pause is ignored
    // so an accidental double click cannot immediately resume the timer.
    const now = performance.now();
    const wasRunning = sideTimers[side].running;
    if (!wasRunning && now - lastToggleAt[side] < 240) return;
    lastToggleAt[side] = now;

    if (wasRunning) pauseSide(side);
    else startSide(side);
  }

  function toggleActiveSide() {
    const running = SIDES.find(side => sideTimers[side].running);
    if (running) pauseSide(running);
    else startSide(activeSide);
  }

  let lastSwitchAt = 0;

  function switchSide() {
    const now = performance.now();
    if (now - lastSwitchAt < 240) return;
    lastSwitchAt = now;

    const running = SIDES.find(side => sideTimers[side].running);
    const target = switchTarget();
    if (running) {
      pauseSide(running, { announcePause: false });
      startSide(target, { announceStart: false });
      announce('切换至' + SIDE_NAMES[target]);
    } else {
      startSide(target);
    }
    updatePhaseControls();
  }

  function handleFinishedSides(finished) {
    dom.screenFlash.classList.remove('is-active');
    void dom.screenFlash.offsetWidth;
    dom.screenFlash.classList.add('is-active');
    playCue('end', finished[0]);
    if (navigator.vibrate) {
      try { navigator.vibrate([120, 70, 200]); } catch (err) { /* noop */ }
    }
    announce(finished.length === 2
      ? '双方时间到，请停止发言'
      : SIDE_NAMES[finished[0]] + '时间到，请停止发言');
    updatePhaseControls();
  }

  function tick() {
    const now = performance.now();
    const finished = [];

    SIDES.forEach(side => {
      const t = sideTimers[side];
      if (!t.running) return;

      const left = (t.endAt - now) / 1000;
      if (left <= 0) {
        t.remaining = 0;
        t.running = false;
        t.ended = true;
        finished.push(side);
        renderSide(side, true);
        return;
      }

      t.remaining = left;
      if (left <= 10 && !t.warn10) {
        t.warn10 = true;
        t.warn30 = true;
        playCue('warn10', side);
        announce(SIDE_NAMES[side] + '最后 10 秒');
      } else if (left <= 30 && !t.warn30) {
        t.warn30 = true;
        playCue('warn30', side);
        announce(SIDE_NAMES[side] + '剩余不足 30 秒');
      }
      renderSide(side);
    });

    if (finished.length) handleFinishedSides(finished);
    updateTitle();

    if (SIDES.some(side => sideTimers[side].running)) timer.raf = requestAnimationFrame(tick);
    else timer.raf = 0;
  }

  function setPhase(index, options = {}) {
    const next = clamp(Number(index), 0, state.phases.length - 1);
    timer.index = next;
    resetBothTimers();
    updatePhaseUI();
    renderPhaseTrack();
    renderPhaseEditor();
    if (options.announce) announce('进入' + currentPhase().name + '，限时 ' + formatSeconds(currentPhase().seconds));
  }

  function prevPhase() {
    if (timer.index <= 0) {
      toast('已经是第一个环节');
      return;
    }
    setPhase(timer.index - 1, { announce: true });
  }

  function nextPhase() {
    if (timer.index >= state.phases.length - 1) {
      toast('已经是最后一个环节');
      return;
    }
    setPhase(timer.index + 1, { announce: true });
  }

  function updatePhaseUI() {
    const phase = currentPhase();
    dom.phaseName.textContent = phase.name || '未命名环节';
    dom.phaseNote.textContent = phase.note || '点击添加环节说明';
    dom.phaseNote.classList.toggle('is-empty', !phase.note);
    updateTitle();
    window.requestAnimationFrame(centerHeading);
  }

  function renderPhaseTrack() {
    dom.phaseTrack.innerHTML = state.phases.map((phase, i) => {
      const active = i === timer.index;
      const displayName = phase.name || '未命名环节';
      return `<button class="phase-step${active ? ' is-active' : ''}" type="button" data-phase-index="${i}" ${active ? 'aria-current="step"' : ''} aria-label="第 ${i + 1} 环节 ${escapeHTML(displayName)}">
        <span class="step-top"><span class="step-num">${pad2(i + 1)}</span></span>
        <span class="step-name">${escapeHTML(displayName)}</span>
      </button>`;
    }).join('');
  }

  function editCurrentPhase(field) {
    openDrawer('schedule');
    window.setTimeout(() => {
      const row = $$('.phase-row', dom.phaseEditor)[timer.index];
      if (!row) return;
      row.scrollIntoView({ block: 'nearest' });
      const input = $('[data-field="' + field + '"]', row);
      if (input) {
        input.focus();
        if (field === 'name' && input.select) input.select();
      }
    }, 320);
  }

  /* ------------------------------------------------------------------
     Settings renderers
  ------------------------------------------------------------------ */
  function renderFontGrid() {
    const order = ['mono', 'yahei'];
    dom.fontGrid.innerHTML = order.map(id => {
      const font = FONTS[id];
      return `<button class="font-card" type="button" data-font-value="${id}" style="font-family:${escapeHTML(font.family)}" aria-label="使用${font.name}字体">
        <span class="font-glyph" style="font-family:${escapeHTML(font.family)}">${font.glyph}</span>
        <span class="font-name">${font.name}</span>
      </button>`;
    }).join('');
  }

  function syncTemplateSelect() {
    let value = 'custom';
    Object.keys(TEMPLATES).forEach(key => {
      if (matchesTemplate(state.phases, key)) value = key;
    });
    dom.templateSelect.value = value;
  }

  function renderPhaseEditor() {
    dom.phaseEditor.innerHTML = state.phases.map((phase, i) => {
      const current = i === timer.index;
      const mins = pad2(Math.floor(phase.seconds / 60));
      const secs = pad2(phase.seconds % 60);
      return `<div class="phase-row${current ? ' is-current' : ''}" data-row-index="${i}">
        <span class="row-num">${pad2(i + 1)}</span>
        <input class="phase-name-input" type="text" maxlength="12" data-field="name" value="${escapeHTML(phase.name)}" aria-label="第 ${i + 1} 环节名称">
        <div class="time-edit">
          <input type="text" inputmode="numeric" maxlength="2" data-field="min" value="${mins}" aria-label="第 ${i + 1} 环节分钟">
          <span>:</span>
          <input type="text" inputmode="numeric" maxlength="2" data-field="sec" value="${secs}" aria-label="第 ${i + 1} 环节秒数">
        </div>
        <button class="row-del" type="button" data-action="delete" aria-label="删除第 ${i + 1} 环节">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6.5 7l.7 13h9.6l.7-13"/><path d="M10 11v5M14 11v5"/></svg>
        </button>
        <input class="phase-note-input" type="text" maxlength="40" data-field="note" value="${escapeHTML(phase.note || '')}" placeholder="环节说明（可选）" aria-label="第 ${i + 1} 环节说明">
      </div>`;
    }).join('');
    syncTemplateSelect();
  }

  /* ------------------------------------------------------------------
     Theme / background / font events
  ------------------------------------------------------------------ */
  function bindStaticEvents() {
    dom.uploadBgBtn.addEventListener('click', () => dom.bgFile.click());
    dom.bgFile.addEventListener('change', () => handleBackgroundFile(dom.bgFile.files && dom.bgFile.files[0]));
    dom.bgBlur.addEventListener('input', () => {
      state.imageBlur = Number(dom.bgBlur.value);
      applyBackground();
      queueSave();
    });
    dom.bgDim.addEventListener('input', () => {
      state.imageDim = Number(dom.bgDim.value);
      applyBackground();
      queueSave();
    });
    dom.clearBg.addEventListener('click', clearBackground);

    dom.fontGrid.addEventListener('click', event => {
      const card = event.target.closest('[data-font-value]');
      if (card) selectFont(card.dataset.fontValue);
    });

    dom.eventTitleInput.addEventListener('input', () => {
      state.eventTitle = dom.eventTitleInput.value.slice(0, 60);
      applyEventText();
      queueSave();
    });
    dom.eventKickerInput.addEventListener('input', () => {
      state.eventKicker = dom.eventKickerInput.value.slice(0, 40);
      applyEventText();
      queueSave();
    });
    dom.affViewpoint.addEventListener('input', () => {
      state.viewpoints.affirmative = dom.affViewpoint.value.slice(0, 80);
      queueSave();
    });
    dom.negViewpoint.addEventListener('input', () => {
      state.viewpoints.negative = dom.negViewpoint.value.slice(0, 80);
      queueSave();
    });
    dom.uploadLogoBtn.addEventListener('click', () => dom.logoFile.click());
    dom.logoFile.addEventListener('change', () => handleLogoFile(dom.logoFile.files && dom.logoFile.files[0]));
    dom.resetLogoBtn.addEventListener('click', resetLogo);
    if (dom.brandPlaceholder) {
      dom.brandPlaceholder.addEventListener('click', () => openThemeField('#uploadLogoBtn'));
    }
    const jumpToField = (element, selector) => {
      if (!element) return;
      element.addEventListener('click', () => openThemeField(selector));
      element.addEventListener('keydown', event => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        event.preventDefault();
        openThemeField(selector);
      });
    };
    jumpToField(dom.eventTitle, '#eventTitleInput');
    jumpToField(dom.eventKicker, '#eventKickerInput');
    dom.uploadAffEmblem.addEventListener('click', () => dom.affEmblemFile.click());
    dom.affEmblemFile.addEventListener('change', () => handleEmblemFile('affirmative', dom.affEmblemFile.files && dom.affEmblemFile.files[0]));
    dom.resetAffEmblem.addEventListener('click', () => resetEmblem('affirmative'));
    dom.uploadNegEmblem.addEventListener('click', () => dom.negEmblemFile.click());
    dom.negEmblemFile.addEventListener('change', () => handleEmblemFile('negative', dom.negEmblemFile.files && dom.negEmblemFile.files[0]));
    dom.resetNegEmblem.addEventListener('click', () => resetEmblem('negative'));
    dom.brandLogo.addEventListener('load', () => window.requestAnimationFrame(centerHeading));

    dom.soundBtn.addEventListener('click', toggleSound);
    dom.soundToggle.addEventListener('click', toggleSound);
    dom.fullscreenBtn.addEventListener('click', toggleFullscreen);
    window.addEventListener('resize', fitEventTitle);
  }

  /* ------------------------------------------------------------------
     Schedule events
  ------------------------------------------------------------------ */
  function bindScheduleEvents() {
    dom.templateSelect.addEventListener('change', () => {
      const key = dom.templateSelect.value;
      if (key === 'custom' || !TEMPLATES[key]) return;
      state.phases = clonePhases(TEMPLATES[key].phases);
      timer.index = 0;
      resetBothTimers();
      updatePhaseUI();
      renderPhaseTrack();
      renderPhaseEditor();
      saveState();
      toast('已载入' + TEMPLATES[key].label);
    });

    dom.addPhase.addEventListener('click', () => {
      if (state.phases.length >= MAX_PHASES) {
        toast('最多添加 ' + MAX_PHASES + ' 个环节', 'error');
        return;
      }
      state.phases.push({ name: '新环节 ' + (state.phases.length + 1), seconds: 120, note: '' });
      renderPhaseTrack();
      renderPhaseEditor();
      updatePhaseUI();
      saveState();
      const rows = $$('.phase-row', dom.phaseEditor);
      const last = rows[rows.length - 1];
      if (last) {
        last.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        const input = $('.phase-name-input', last);
        if (input) { input.focus(); input.select(); }
      }
      toast('已添加环节');
    });

    dom.phaseEditor.addEventListener('input', event => {
      const row = event.target.closest('.phase-row');
      if (!row) return;
      const index = Number(row.dataset.rowIndex);
      const phase = state.phases[index];
      if (!phase) return;
      if (event.target.matches('[data-field="name"]')) {
        phase.name = event.target.value.slice(0, 12);
        renderPhaseTrack();
        if (index === timer.index) dom.phaseName.textContent = phase.name || '未命名环节';
        queueSave();
      } else if (event.target.matches('[data-field="note"]')) {
        phase.note = event.target.value.slice(0, 40);
        if (index === timer.index) {
          dom.phaseNote.textContent = phase.note || '点击添加环节说明';
          dom.phaseNote.classList.toggle('is-empty', !phase.note);
        }
        queueSave();
      }
    });

    dom.phaseEditor.addEventListener('change', event => {
      const row = event.target.closest('.phase-row');
      if (!row) return;
      const index = Number(row.dataset.rowIndex);
      const phase = state.phases[index];
      if (!phase) return;
      if (!event.target.matches('[data-field="min"], [data-field="sec"]')) return;

      const minInput = $('[data-field="min"]', row);
      const secInput = $('[data-field="sec"]', row);
      let minutes = clamp(parseInt(minInput.value, 10) || 0, 0, 99);
      let seconds = clamp(parseInt(secInput.value, 10) || 0, 0, 59);
      let total = minutes * 60 + seconds;
      if (total < 1) total = 1;
      phase.seconds = total;
      minInput.value = pad2(Math.floor(total / 60));
      secInput.value = pad2(total % 60);
      const wasCurrent = index === timer.index;
      if (wasCurrent) {
        resetBothTimers();
        updatePhaseUI();
        toast('环节时长已更新，双方计时已重置');
      }
      if (wasCurrent) renderPhaseEditor();
      saveState();
    });

    dom.phaseEditor.addEventListener('click', event => {
      const del = event.target.closest('[data-action="delete"]');
      if (!del) return;
      const row = del.closest('.phase-row');
      const index = Number(row.dataset.rowIndex);
      if (state.phases.length <= 1) {
        toast('至少保留一个环节', 'error');
        return;
      }
      state.phases.splice(index, 1);
      if (timer.index >= state.phases.length) timer.index = state.phases.length - 1;
      else if (index < timer.index) timer.index -= 1;
      resetBothTimers();
      updatePhaseUI();
      renderPhaseTrack();
      renderPhaseEditor();
      saveState();
      toast('已删除环节');
    });

    dom.resetSchedule.addEventListener('click', () => {
      state.phases = clonePhases(DEFAULT_PHASES);
      timer.index = 0;
      resetBothTimers();
      updatePhaseUI();
      renderPhaseTrack();
      renderPhaseEditor();
      saveState();
      toast('已恢复默认赛程');
    });
  }

  /* ------------------------------------------------------------------
     Main timer events
  ------------------------------------------------------------------ */
  function bindTimerEvents() {
    dom.prevPhaseBtn.addEventListener('click', prevPhase);
    dom.switchSideBtn.addEventListener('click', switchSide);
    dom.nextPhaseBtn.addEventListener('click', nextPhase);
    dom.phaseName.addEventListener('click', () => editCurrentPhase('name'));
    dom.phaseNote.addEventListener('click', () => editCurrentPhase('note'));

    dom.dualStage.addEventListener('click', event => {
      const button = event.target.closest('[data-side-action]');
      if (button) {
        const side = button.dataset.side;
        const action = button.dataset.sideAction;
        if (!SIDE_NAMES[side]) return;
        if (action === 'toggle') toggleSide(side);
        else if (action === 'reset') {
          resetSide(side);
          toast('已重置' + SIDE_NAMES[side] + '计时');
        }
        return;
      }
      // Large, obvious tap target: clicking the digits pauses/resumes that side.
      const clock = event.target.closest('.panel-clock');
      if (!clock) return;
      const panel = clock.closest('.timer-panel');
      const side = panel && panel.id === 'affirmativePanel'
        ? 'affirmative'
        : panel && panel.id === 'negativePanel' ? 'negative' : null;
      if (side) toggleSide(side);
    });

    dom.phaseTrack.addEventListener('click', event => {
      const step = event.target.closest('[data-phase-index]');
      if (!step) return;
      setPhase(Number(step.dataset.phaseIndex));
    });
  }

  /* ------------------------------------------------------------------
     Drawer
  ------------------------------------------------------------------ */
  const TAB_IDS = ['theme', 'bg', 'font', 'schedule'];

  function activateTab(name, focus = false) {
    if (!TAB_IDS.includes(name)) return;
    $$('.tab', dom.drawer).forEach(tab => {
      const active = tab.dataset.tab === name;
      tab.classList.toggle('is-active', active);
      tab.setAttribute('aria-selected', String(active));
      tab.tabIndex = active ? 0 : -1;
      if (active && focus) tab.focus();
    });
    TAB_IDS.forEach(id => {
      const panel = $('#panel-' + id);
      if (panel) panel.hidden = id !== name;
    });
  }

  function openDrawer(tab = 'theme') {
    lastFocused = document.activeElement;
    dom.drawer.classList.add('is-open');
    dom.scrim.classList.add('is-open');
    dom.drawer.setAttribute('aria-hidden', 'false');
    dom.settingsBtn.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
    activateTab(tab);
    window.setTimeout(() => dom.closeDrawer.focus(), 80);
  }

  function openThemeField(selector) {
    if (!drawerIsOpen()) openDrawer('theme');
    window.setTimeout(() => {
      const el = $(selector, dom.drawer);
      if (!el) return;
      const block = el.closest('.field-block') || el;
      block.scrollIntoView({ block: 'center', behavior: 'smooth' });
      block.classList.add('is-target');
      window.setTimeout(() => block.classList.remove('is-target'), 1200);
      if (typeof el.focus === 'function') el.focus({ preventScroll: true });
      if (typeof el.select === 'function' && el.tagName === 'INPUT') el.select();
    }, 340);
  }

  function closeDrawer() {
    dom.drawer.classList.remove('is-open');
    dom.scrim.classList.remove('is-open');
    dom.drawer.setAttribute('aria-hidden', 'true');
    dom.settingsBtn.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
    if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
  }

  function drawerIsOpen() {
    return dom.drawer.classList.contains('is-open');
  }

  function getFocusable() {
    return $$('button:not([disabled]):not([hidden]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), [tabindex]:not([tabindex="-1"])', dom.drawer)
      .filter(el => el.offsetParent !== null || el === document.activeElement);
  }

  function bindDrawerEvents() {
    dom.settingsBtn.addEventListener('click', () => {
      if (drawerIsOpen()) closeDrawer();
      else openDrawer();
    });
    dom.closeDrawer.addEventListener('click', closeDrawer);
    dom.scrim.addEventListener('click', closeDrawer);
    dom.drawer.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => activateTab(tab.dataset.tab));
      tab.addEventListener('keydown', event => {
        if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        const current = TAB_IDS.indexOf(tab.dataset.tab);
        let next = current;
        if (event.key === 'ArrowLeft') next = (current - 1 + TAB_IDS.length) % TAB_IDS.length;
        if (event.key === 'ArrowRight') next = (current + 1) % TAB_IDS.length;
        if (event.key === 'Home') next = 0;
        if (event.key === 'End') next = TAB_IDS.length - 1;
        activateTab(TAB_IDS[next], true);
      });
    });

    dom.drawer.addEventListener('keydown', event => {
      if (event.key !== 'Tab') return;
      const focusable = getFocusable();
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        if (drawerIsOpen()) {
          event.preventDefault();
          closeDrawer();
        }
        return;
      }
      if (drawerIsOpen()) return;
      const target = event.target;
      if (target && target.closest && target.closest('input, textarea, select, [contenteditable="true"]')) return;

      const key = event.key.toLowerCase();
      const plain = !event.metaKey && !event.ctrlKey && !event.altKey;
      const onButton = target && target.closest && target.closest('button, a, [role="button"]');
      if (event.code === 'Space') {
        if (onButton) return;
        event.preventDefault();
        toggleActiveSide();
      } else if (key === 'arrowleft' || (key === 'p' && plain)) {
        event.preventDefault();
        prevPhase();
      } else if (key === 'arrowright' || (key === 'n' && plain)) {
        event.preventDefault();
        nextPhase();
      } else if (key === 'f' && plain) {
        event.preventDefault();
        toggleFullscreen();
      } else if (key === 's' && plain) {
        event.preventDefault();
        openDrawer();
      } else if (key === 'm' && plain) {
        event.preventDefault();
        toggleSound();
      }
    });
  }

  async function toggleFullscreen() {
    try {
      if (!document.fullscreenElement) {
        await dom.root.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (err) {
      toast('当前浏览器不支持全屏', 'error');
    }
  }

  function syncFullscreenUI() {
    const active = !!document.fullscreenElement;
    dom.fullscreenBtn.setAttribute('aria-label', active ? '退出全屏' : '进入全屏');
    dom.fullscreenBtn.title = active ? '退出全屏' : '全屏';
    $('#fsIcon').innerHTML = active
      ? '<path d="M8 4v4H4M16 4v4h4M20 16h-4v4M4 16h4v4"/>'
      : '<path d="M8 4H4v4M16 4h4v4M20 16v4h-4M4 16v4h4"/>';
  }

  /* ------------------------------------------------------------------
     Floating tools
  ------------------------------------------------------------------ */
  function hideUtilityBar() {
    dom.utilityBar.classList.remove('is-visible');
  }

  function showUtilityBar(duration = 2600) {
    dom.utilityBar.classList.add('is-visible');
    window.clearTimeout(toolsHideTimer);
    if (duration > 0) {
      toolsHideTimer = window.setTimeout(() => {
        if (!dom.utilityBar.matches(':hover') && !dom.utilityBar.contains(document.activeElement)) hideUtilityBar();
      }, duration);
    }
  }

  function bindUtilityReveal() {
    const nearTopEdge = event => event.clientY < 110;
    document.addEventListener('pointermove', event => {
      if (nearTopEdge(event)) showUtilityBar(2600);
    });
    document.addEventListener('pointerdown', event => {
      if (nearTopEdge(event)) showUtilityBar(3000);
    });
    dom.utilityBar.addEventListener('pointerenter', () => showUtilityBar(0));
    dom.utilityBar.addEventListener('pointerleave', () => {
      window.clearTimeout(toolsHideTimer);
      toolsHideTimer = window.setTimeout(() => {
        if (!dom.utilityBar.contains(document.activeElement)) hideUtilityBar();
      }, 320);
    });
    dom.utilityBar.addEventListener('focusin', () => showUtilityBar(0));
    dom.utilityBar.addEventListener('focusout', () => {
      window.setTimeout(() => {
        if (!dom.utilityBar.contains(document.activeElement)) hideUtilityBar();
      }, 120);
    });
  }

  /* ------------------------------------------------------------------
     Reset all
  ------------------------------------------------------------------ */
  function applyAllState() {
    activeSide = 'affirmative';
    applyTheme();
    applyFont();
    applyBackground();
    syncSoundUI();
    applyEventText();
    applyViewpoints();
    applySideEmblems();
    syncLogoUI(false);
    updatePhaseUI();
    renderPhaseTrack();
    renderPhaseEditor();
    resetBothTimers();
    syncTemplateSelect();
  }

  function resetAll() {
    if (!resetAllArmed) {
      resetAllArmed = true;
      dom.resetAll.textContent = '再次点击确认';
      dom.resetAll.classList.add('danger');
      window.clearTimeout(resetAllTimeout);
      resetAllTimeout = window.setTimeout(() => {
        resetAllArmed = false;
        dom.resetAll.textContent = '恢复全部默认';
        dom.resetAll.classList.remove('danger');
      }, 3000);
      return;
    }
    window.clearTimeout(resetAllTimeout);
    window.clearTimeout(saveTimer);
    resetAllArmed = false;
    dom.resetAll.textContent = '恢复全部默认';
    dom.resetAll.classList.remove('danger');
    removeStorage(STORAGE_KEYS.settings);
    removeStorage(STORAGE_KEYS.background);
    removeStorage(STORAGE_KEYS.logo);
    removeStorage(STORAGE_KEYS.emblems);
    sideEmblems = { affirmative: '', negative: '' };
    applySideEmblems();
    syncLogoUI(false);
    const fresh = defaultState();
    Object.keys(fresh).forEach(key => { state[key] = fresh[key]; });
    timer.index = 0;
    dom.customBg.removeAttribute('src');
    applyAllState();
    toast('已恢复全部默认设置');
  }

  /* ------------------------------------------------------------------
     Custom assets on boot
  ------------------------------------------------------------------ */
  async function restoreAssets() {
    const storedEmblems = readStorage(STORAGE_KEYS.emblems);
    if (storedEmblems) {
      try {
        const parsed = JSON.parse(storedEmblems);
        if (parsed && typeof parsed === 'object') {
          sideEmblems.affirmative = typeof parsed.affirmative === 'string' ? parsed.affirmative : '';
          sideEmblems.negative = typeof parsed.negative === 'string' ? parsed.negative : '';
        }
      } catch (err) {
        sideEmblems = { affirmative: '', negative: '' };
      }
    }
    applySideEmblems();
    const customLogo = readStorage(STORAGE_KEYS.logo);
    if (customLogo) {
      dom.brandLogo.src = customLogo;
      syncLogoUI(true);
    } else {
      syncLogoUI(false);
    }
    const bg = readStorage(STORAGE_KEYS.background);
    if (bg) {
      state.image = bg;
      state.imageKind = 'upload';
    }
    applyFont();
    applyBackground();
    syncFontUI();
    syncBgUI();
  }

  /* ------------------------------------------------------------------
     Boot
  ------------------------------------------------------------------ */
  function init() {
    renderFontGrid();
    bindStaticEvents();
    bindScheduleEvents();
    bindTimerEvents();
    bindDrawerEvents();
    bindUtilityReveal();
    document.addEventListener('fullscreenchange', syncFullscreenUI);

    dom.resetAll.addEventListener('click', resetAll);

    applyTheme();
    applyFont();
    applyBackground();
    syncSoundUI();
    applyEventText();
    applyViewpoints();
    applySideEmblems();
    updatePhaseUI();
    renderPhaseTrack();
    renderPhaseEditor();
    resetBothTimers();
    syncTemplateSelect();
    activateTab('theme');
    syncFullscreenUI();

    restoreAssets().then(() => {
      applyBackground();
      syncFontUI();
      syncTemplateSelect();
      window.setTimeout(centerHeading, 900);
    }).catch(() => {
      /* assets are optional */
    });
    window.setTimeout(centerHeading, 1050);
  }

  init();
})();
</script>

<script>
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    const registerTimerServiceWorker = () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    };
    registerTimerServiceWorker();
    window.addEventListener('load', registerTimerServiceWorker, { once: true });
  }
</script>
